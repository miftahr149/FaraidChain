version: '3.8'

services:
  # Service 1: Your MySQL Database
  db:
    image: mysql:8.0
    container_name: estate-db
    environment:
      MYSQL_DATABASE: emsdb
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service 2: Your Java Application
  app:
    build: .
    container_name: estate-app
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # We use 'db' (the service name) instead of localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/emsdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123